<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supabase Todo App</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <h1>To-Do List <img src="./images/icon.png" alt="" /></h1>
        <form onsubmit="todo(event)">
          <input
            type="text"
            id="todo-input"
            placeholder="Add your task"
            required
          />
          <button type="submit">Add</button>
        </form>
        <ul id="todo-output"></ul>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
